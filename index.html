<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aim Range</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="scene"></canvas>

  <!-- crosshair -->
  <div id="crosshair">
    <div class="ch-dot"></div>
    <div class="ch-line ch-top"></div>
    <div class="ch-line ch-bottom"></div>
    <div class="ch-line ch-left"></div>
    <div class="ch-line ch-right"></div>
  </div>
  <div id="hitmarker"></div>
  <div id="headshot-text">HEADSHOT</div>
  <div id="weapon-hud" class="hidden"></div>

  <!-- in-game HUD -->
  <div id="hud" class="hidden">
    <div id="hud-time">60</div>
    <div id="hud-stats">
      <span id="hud-score">0</span> KILLS
      <span id="hud-hs">(0 HS)</span> &nbsp;|&nbsp;
      <span id="hud-acc">100%</span> <span id="hud-acc-label">ACC</span>
    </div>
  </div>

  <!-- start / pause overlay -->
  <div id="overlay">
    <div class="panel">
      <h1>AIM RANGE</h1>

      <div class="row">
        <label>모드</label>
        <select id="opt-mode">
          <option value="gridshot" selected>그리드샷 (표적 처치)</option>
          <option value="tracking">트래킹 (추적 사격)</option>
          <option value="flick">플릭 (반응 사격)</option>
        </select>
      </div>
      <p class="mode-info" id="mode-info"></p>

      <div class="row">
        <label>라운드 시간</label>
        <select id="opt-duration">
          <option value="30">30초</option>
          <option value="60" selected>60초</option>
          <option value="120">120초</option>
          <option value="0">무제한</option>
        </select>
      </div>

      <div class="row">
        <label>표적 개수</label>
        <select id="opt-targets">
          <option value="2">2</option>
          <option value="3" selected>3</option>
          <option value="4">4</option>
          <option value="6">6</option>
        </select>
      </div>

      <div class="row">
        <label>이동 표적 비율</label>
        <select id="opt-movingratio">
          <option value="0">정지 표적만</option>
          <option value="0.5" selected>혼합</option>
          <option value="1">이동 표적만</option>
        </select>
      </div>

      <div class="row">
        <label>무기</label>
        <select id="opt-weapon">
          <option value="sheriff">셰리프</option>
          <option value="vandal" selected>밴달</option>
          <option value="phantom">팬텀</option>
        </select>
      </div>

      <div class="row">
        <label>조준선</label>
        <select id="opt-crosshair">
          <option value="both" selected>십자 + 점</option>
          <option value="cross">십자</option>
          <option value="dot">점</option>
        </select>
      </div>

      <div class="row">
        <label>음량</label>
        <input type="range" id="opt-volume" min="0" max="100" step="1" value="70" />
        <span id="volume-value" class="volume-value">70%</span>
        <button type="button" id="btn-mute" class="mute-btn" aria-label="음소거">🔊</button>
      </div>

      <div class="sens-group">
        <div class="row">
          <label>마우스 DPI</label>
          <input type="number" id="opt-dpi" min="100" max="30000" step="50" value="800" />
        </div>
        <div class="row">
          <label>발로란트 감도</label>
          <input type="number" id="opt-valsens" min="0.01" max="10" step="0.01" value="0.5" />
        </div>
        <p class="sens-info" id="sens-info">cm/360: -- · 발로란트와 동일한 마우스 회전값으로 맞춰줍니다</p>
        <div class="row">
          <label>발로란트 FOV</label>
          <input type="number" id="opt-fov" min="90" max="103" step="1" value="103" />
        </div>
        <p class="sens-info">발로란트와 동일한 가로 시야각(4:3 기준) 변환으로 화면 비율에 맞게 적용됩니다</p>
      </div>

      <button id="btn-start">클릭해서 시작 (마우스 잠금)</button>
      <p class="hint">WASD 이동 · 스페이스 점프 · 마우스 조준 · 좌클릭 사격 · 우클릭 조준(ADS, 밴달·팬텀만) · 1/2/3 무기 전환 · ESC 일시정지</p>
    </div>
  </div>

  <!-- results overlay -->
  <div id="results" class="hidden">
    <div class="panel">
      <h1>결과</h1>
      <div class="result-grid">
        <div><span id="res-hits">0</span><label>KILLS</label></div>
        <div><span id="res-hs">0</span><label>HEADSHOTS</label></div>
        <div><span id="res-shots">0</span><label>SHOTS</label></div>
        <div><span id="res-acc">0%</span><label>ACCURACY</label></div>
        <div><span id="res-avgrt">0ms</span><label>AVG REACTION</label></div>
      </div>
      <div class="final-score">
        <span id="res-score">0</span><span class="score-max">/100</span>
        <span class="score-label">종합 점수 · 모드 간 비교용</span>
      </div>
      <button id="btn-restart">다시 시작</button>
    </div>
  </div>

  <script src="https://unpkg.com/three@0.128.0/build/three.min.js" integrity="sha384-CI3ELBVUz9XQO+97x6nwMDPosPR5XvsxW2ua7N1Xeygeh1IxtgqtCkGfQY9WWdHu" crossorigin="anonymous"></script>
  <script src="game.js"></script>
</body>
</html>
